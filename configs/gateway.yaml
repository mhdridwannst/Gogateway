server:
  listen_addr: ":8080"
  read_timeout: 5s
  read_header_timeout: 2s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576 # 1 MB

routes:
  - name: "users-service"
    path_prefix: "/api/v1/users"
    strategy: "round_robin"
    strip_prefix: true
    backends:
      - "http://127.0.0.1:9001"
      - "http://127.0.0.1:9002"
    health_check:
      path: "/healthz"
      interval: 5s
      timeout: 2s
      unhealthy_threshold: 3
      healthy_threshold: 2

  - name: "orders-service"
    path_prefix: "/api/v1/orders"
    strategy: "least_conn"
    strip_prefix: false
    backends:
      - "http://127.0.0.1:9003"
      - "http://127.0.0.1:9004"
    health_check:
      path: "/healthz"
      interval: 5s
      timeout: 2s
      unhealthy_threshold: 3
      healthy_threshold: 2
